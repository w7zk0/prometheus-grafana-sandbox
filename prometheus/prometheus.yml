# =============================================================================
# Configuration Prometheus - Portfolio SysAdmin
# =============================================================================

global:
  scrape_interval: 15s          # Fréquence de scrape par défaut
  evaluation_interval: 15s      # Fréquence d'évaluation des règles
  scrape_timeout: 10s

  # Labels externes (utiles pour la fédération / remote write)
  external_labels:
    monitor: 'portfolio-sysadmin'
    environment: 'demo'
    cluster: 'local-docker'

# Fichiers de règles d'alerting / recording rules
rule_files:
  - /etc/prometheus/rules/*.yml

# Configuration d'alerting → Alertmanager
alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  # -------------------------------------------------------------------------
  # Prometheus se scrape lui-même (métriques internes)
  # -------------------------------------------------------------------------
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
        labels:
          instance: 'prometheus'

  # -------------------------------------------------------------------------
  # Node Exporter - Métriques de l'hôte Linux
  # -------------------------------------------------------------------------
  - job_name: 'node'
    static_configs:
      - targets: ['node-exporter:9100']
        labels:
          instance: 'docker-host'
          job: 'node'

  # -------------------------------------------------------------------------
  # cAdvisor - Métriques des conteneurs Docker
  # -------------------------------------------------------------------------
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']
        labels:
          instance: 'docker-host'

  # -------------------------------------------------------------------------
  # Grafana (métriques internes optionnelles)
  # -------------------------------------------------------------------------
  - job_name: 'grafana'
    static_configs:
      - targets: ['grafana:3000']
        labels:
          instance: 'grafana'
    metrics_path: /metrics

  # -------------------------------------------------------------------------
  # Blackbox Exporter - Self metrics
  # -------------------------------------------------------------------------
  - job_name: 'blackbox'
    static_configs:
      - targets: ['blackbox-exporter:9115']
        labels:
          instance: 'blackbox-exporter'

  # -------------------------------------------------------------------------
  # Alertmanager - Self metrics
  # -------------------------------------------------------------------------
  - job_name: 'alertmanager'
    static_configs:
      - targets: ['alertmanager:9093']
        labels:
          instance: 'alertmanager'

  # -------------------------------------------------------------------------
  # Blackbox probes - Exemples de cibles HTTP/HTTPS
  # Remplace ou ajoute tes propres URLs ci-dessous
  # -------------------------------------------------------------------------
  - job_name: 'blackbox-http'
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - https://prometheus.io
          - https://grafana.com
          - https://github.com
          - http://prometheus:9090      # Internal - Prometheus lui-même
          - http://grafana:3000         # Internal - Grafana
        labels:
          probe_type: http
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  # -------------------------------------------------------------------------
  # Blackbox probes - TCP (ex: ports de services)
  # -------------------------------------------------------------------------
  - job_name: 'blackbox-tcp'
    metrics_path: /probe
    params:
      module: [tcp_connect]
    static_configs:
      - targets:
          - prometheus:9090
          - grafana:3000
          - node-exporter:9100
        labels:
          probe_type: tcp
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
