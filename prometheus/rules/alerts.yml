# =============================================================================
# Règles d'alerting Prometheus - Exemples portfolio
# =============================================================================

groups:
  - name: host_alerts
    rules:
      # CPU élevé
      - alert: HighCPUUsage
        expr: 100 - (avg by(instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "CPU usage élevé sur {{ $labels.instance }}"
          description: "Le CPU est à {{ $value | printf \"%.1f\" }}% depuis plus de 5 minutes."

      # Mémoire élevée
      - alert: HighMemoryUsage
        expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Mémoire élevée sur {{ $labels.instance }}"
          description: "Utilisation mémoire : {{ $value | printf \"%.1f\" }}%."

      # Espace disque faible
      - alert: DiskSpaceLow
        expr: (node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay"}) * 100 < 15
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "Espace disque faible sur {{ $labels.instance }}"
          description: "Il reste moins de 15% d'espace libre sur {{ $labels.mountpoint }}."

      # Instance down
      - alert: InstanceDown
        expr: up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Instance {{ $labels.instance }} down"
          description: "La cible {{ $labels.job }} / {{ $labels.instance }} est inaccessible depuis 1 minute."

  - name: blackbox_alerts
    rules:
      # Probe HTTP/TCP échoué
      - alert: EndpointDown
        expr: probe_success == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Endpoint down : {{ $labels.instance }}"
          description: "La sonde Blackbox a échoué pour {{ $labels.instance }} (module={{ $labels.job }})."

      # Latence élevée
      - alert: EndpointHighLatency
        expr: probe_duration_seconds > 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Latence élevée sur {{ $labels.instance }}"
          description: "Le temps de réponse est de {{ $value | printf \"%.2f\" }}s (seuil 2s)."

      # Certificat SSL bientôt expiré (< 15 jours)
      - alert: SSLCertExpiringSoon
        expr: probe_ssl_earliest_cert_expiry - time() < 86400 * 15
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "Certificat SSL expire bientôt : {{ $labels.instance }}"
          description: "Le certificat expire dans moins de 15 jours."
