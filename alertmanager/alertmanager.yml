# =============================================================================
# Alertmanager - Configuration portfolio
# =============================================================================

global:
  # Intervalle de résolution (quand une alerte redevient OK)
  resolve_timeout: 5m

# Templates (optionnel)
# templates:
#   - '/etc/alertmanager/templates/*.tmpl'

route:
  # Groupe les alertes par ces labels
  group_by: ['alertname', 'severity', 'instance']
  group_wait: 30s          # Attente avant d'envoyer le premier groupe
  group_interval: 5m       # Intervalle entre envois d'un même groupe
  repeat_interval: 4h      # Ré-envoi si l'alerte est toujours active
  receiver: 'default'

  # Routes plus spécifiques (exemples)
  routes:
    - match:
        severity: critical
      receiver: 'critical'
      continue: true

    - match:
        severity: warning
      receiver: 'default'

receivers:
  # Receiver par défaut (juste log / console pour la démo)
  - name: 'default'
    # webhook_configs:
    #   - url: 'http://localhost:5001/'
    #     send_resolved: true

  # Receiver pour les alertes critiques (à brancher plus tard sur Slack/email)
  - name: 'critical'
    # slack_configs:
    #   - api_url: 'https://hooks.slack.com/services/XXX/YYY/ZZZ'
    #     channel: '#alerts'
    #     send_resolved: true
    # email_configs:
    #   - to: 'alerts@example.com'
    #     from: 'alertmanager@example.com'
    #     smarthost: 'smtp.example.com:587'
    #     auth_username: 'user'
    #     auth_password: 'pass'

# Inhibition rules (évite le spam)
inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'instance']
